[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
timeout = 30
stdout_callback = default
nocows = 1
interpreter_python = auto_silent
# The API container runs with a read-only root filesystem (only /tmp is
# writable, via tmpfs - see docker-compose.yml) and HOME=/home/scanner is
# NOT writable there. ansible-playbook creates its local scratch directory
# eagerly at startup (before touching any target host), so the default
# ~/.ansible/tmp must be redirected to somewhere writable in every
# deployment mode: /tmp is writable under Docker (tmpfs) and under the
# systemd unit (PrivateTmp=true).
local_tmp = /tmp/ansible-local
# community.docker/ansible.posix are installed at image build time (as
# root) into this system-wide path rather than ~/.ansible/collections -
# see api/Dockerfile for why. Set explicitly rather than relying on
# Ansible's implicit default search order.
collections_path = /usr/share/ansible/collections

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
# Same reasoning as local_tmp above: the SSH ControlMaster socket
# directory also defaults under ~/.ansible and must be redirected to a
# writable path.
control_path_dir = /tmp/ansible-cp
