; Ansible inventory for the Nextcloud upload scanner - TWO separate host
; groups, matching the two-server architecture:
;
;   [nextcloud] - server(s) running Nextcloud. Read-only access to the
;                 uploaded file only. NEVER runs Docker/ClamAV.
;   [scanner]   - the server running the API/worker/Ansible/Docker/ClamAV/
;                 PostgreSQL/management panel. This is where the worker
;                 process itself lives, so its connection is local, not SSH.
;
; Each [nextcloud] entry's NAME must correspond to a KEY in the API's
; NEXTCLOUD_HOSTS map (see .env: NEXTCLOUD_HOSTS) - that name doubles as
; the exact `--limit` value ansible_runner.py passes. The API never
; accepts an arbitrary Ansible hostname, connection detail, or extra-var
; from the HTTP client - it only ever selects one of these names from a
; server-side allowlist.

[nextcloud]
debian ansible_host=192.168.150.87 ansible_user=root ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[nextcloud:vars]
; The SSH user should be a dedicated, low-privilege service account with
; READ access to the Nextcloud data directory (group membership or a
; POSIX ACL - see README "Target host setup") - NOT root, and no
; passwordless sudo is required (become: false throughout). It does NOT
; need Docker access at all - Docker never runs on this host.
ansible_ssh_private_key_file=/home/scanner/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

[scanner]
; The worker container/process runs ON this same machine (see
; docker-compose.yml's `worker` service), so Ansible reaches it via a
; local connection, not SSH-to-self. If you ever run the worker on a
; DIFFERENT host than the one with Docker, replace this with a real SSH
; entry shaped like the [nextcloud] one above.
debian ansible_connection=local ansible_host=127.0.0.1 ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[scanner:vars]
; Use the same Python interpreter that is already running ansible-playbook
; itself - correct and unambiguous for a local connection, avoids
; interpreter-discovery warnings.
ansible_python_interpreter={{ ansible_playbook_python }}
